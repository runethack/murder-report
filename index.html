<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Murder Report — анализ телефонного номера">
  <title>Murder Report — поиск номера</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; font-family: system-ui, sans-serif; background: linear-gradient(135deg,#667eea,#764ba2); }
    .container { width: min(680px,100%); padding: 32px; background: #fff; border-radius: 12px; box-shadow: 0 20px 60px #0004; }
    h1, .subtitle { text-align: center; } .subtitle { color: #666; }
    .search-box { display: flex; gap: 10px; margin: 28px 0 18px; }
    input { min-width: 0; flex: 1; padding: 12px; font-size: 16px; border: 2px solid #ddd; border-radius: 6px; }
    button { padding: 12px 24px; color: white; background: #667eea; border: 0; border-radius: 6px; cursor: pointer; }
    button:hover { background: #764ba2; }
    #loading, #result, #error { display: none; } #loading.show, #result.show, #error.show { display: block; }
    #result { margin-top: 20px; padding: 16px; overflow-x: auto; background: #f8f9fa; border-radius: 6px; }
    #error { margin-top: 16px; padding: 12px; color: #a00; background: #ffebee; border-radius: 6px; }
    .info { margin-top: 18px; padding: 12px; color: #1769aa; background: #e3f2fd; border-left: 4px solid #667eea; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; } td { padding: 8px; border-bottom: 1px solid #ddd; vertical-align: top; word-break: break-word; } td:first-child { width: 30%; color: #667eea; font-weight: 700; }
  </style>
</head>
<body>
  <main class="container">
    <h1>🔍 Murder Report</h1>
    <p class="subtitle">Анализ открытых данных по номеру телефона</p>
    <div class="search-box">
      <input id="numberInput" type="text" maxlength="20" placeholder="Введите номер телефона">
      <button id="searchButton" type="button">Поиск</button>
    </div>
    <div id="loading">⏳ Идёт поиск данных...</div>
    <div id="result"><strong id="resultTitle"></strong><div id="resultContent"></div></div>
    <div id="error"></div>
    <div class="info">Источник: <code>https://num.voxlink.ru/get/v2/?num={num}</code>. API является сторонним сервисом.</div>
  </main>
  <script>
    const API_URL = "https://num.voxlink.ru/get/v2/?num=";
    const $ = id => document.getElementById(id);
    function cleanNumber(value) { return value.replace(/\D/g, ''); }
    function escapeHtml(value) { const div = document.createElement('div'); div.textContent = String(value); return div.innerHTML; }
    function showError(message) { $('error').textContent = '❌ ' + message; $('error').classList.add('show'); $('result').classList.remove('show'); $('loading').classList.remove('show'); }
    async function searchNumber() {
      const number = cleanNumber($('numberInput').value);
      if (!number) return showError('Введите номер телефона');
      if (number.length < 7) return showError('Номер должен содержать минимум 7 цифр');
      $('loading').classList.add('show'); $('error').classList.remove('show'); $('result').classList.remove('show');
      try {
        const response = await fetch(API_URL + encodeURIComponent(number));
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        const rows = Object.entries(data && typeof data === 'object' ? data : {}).map(([key, value]) => `<tr><td>${escapeHtml(key)}</td><td>${escapeHtml(typeof value === 'object' ? JSON.stringify(value, null, 2) : value)}</td></tr>`).join('');
        $('resultTitle').textContent = '✅ Результаты для номера: ' + number;
        $('resultContent').innerHTML = rows ? `<table>${rows}</table>` : 'Данные не найдены.';
        $('result').classList.add('show');
      } catch (error) { showError('Ошибка запроса к API: ' + error.message); }
      finally { $('loading').classList.remove('show'); }
    }
    $('searchButton').addEventListener('click', searchNumber);
    $('numberInput').addEventListener('keydown', event => { if (event.key === 'Enter') searchNumber(); });
  </script>
</body>
</html>
